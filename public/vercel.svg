<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Rotated dotted D logo">
  <rect width="1024" height="1024" fill="#000000"/>

  <!-- Enlarged 45-degree rotated D mark -->
  <g transform="translate(512 512) rotate(45) scale(1.18) translate(-512 -512)">
    <!-- orange spine -->
    <line x1="370" y1="282" x2="370" y2="742" stroke="#FF7A00" stroke-width="8" stroke-linecap="round"/>

    <!-- hollow orange end nodes -->
    <circle cx="370" cy="282" r="22" fill="#000000" stroke="#FF7A00" stroke-width="8"/>
    <circle cx="370" cy="742" r="22" fill="#000000" stroke="#FF7A00" stroke-width="8"/>

    <!-- white center node -->
    <circle cx="370" cy="512" r="20" fill="#FFFFFF"/>

    <!-- breathing-size white dotted arc -->
    <circle cx="455" cy="285" r="8" fill="#FFFFFF"/>
    <circle cx="505" cy="296" r="11" fill="#FFFFFF"/>
    <circle cx="552" cy="318" r="14" fill="#FFFFFF"/>
    <circle cx="595" cy="352" r="17" fill="#FFFFFF"/>
    <circle cx="630" cy="396" r="19" fill="#FFFFFF"/>
    <circle cx="653" cy="448" r="21" fill="#FFFFFF"/>
    <circle cx="662" cy="512" r="22" fill="#FFFFFF"/>
    <circle cx="653" cy="576" r="21" fill="#FFFFFF"/>
    <circle cx="630" cy="628" r="19" fill="#FFFFFF"/>
    <circle cx="595" cy="672" r="17" fill="#FFFFFF"/>
    <circle cx="552" cy="706" r="14" fill="#FFFFFF"/>
    <circle cx="505" cy="728" r="11" fill="#FFFFFF"/>
    <circle cx="455" cy="739" r="8" fill="#FFFFFF"/>
  </g>
</svg>
